<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 730" width="860" height="730" role="img" aria-labelledby="t desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">man sudaraka</title>
<desc id="desc">A terminal showing a Unix manual page for Sudaraka Senevirathne in Sri Lanka, open to freelance work, working with Java, C++, TypeScript, JavaScript, Spring Boot, Node.js, React, Angular, PostgreSQL, MongoDB, DynamoDB, AWS, GCP and Docker.</desc>
<defs>
<pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity="0.22"/></pattern>
<radialGradient id="vig" cx="50%" cy="45%" r="75%"><stop offset="60%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity="0.55"/></radialGradient>
<filter id="glow" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="typed"><rect x="62.1" y="58" height="22" width="0"><animate attributeName="width" values="0.0;9.1;18.1;27.2;36.2;45.2;54.3;63.4;72.4;81.5;90.5;99.6;108.6" keyTimes="0.000;0.083;0.167;0.250;0.333;0.417;0.500;0.583;0.667;0.750;0.833;0.917;1.000" calcMode="discrete" begin="0.5s" dur="1.1s" fill="freeze"/></rect></clipPath>
