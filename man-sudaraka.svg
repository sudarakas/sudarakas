</g>
<g opacity="0"><set attributeName="opacity" to="1" begin="2.30s" fill="freeze"/><text x="44" y="74" class="d">SUDARAKA(1)</text><text x="430.0" y="74" class="d" text-anchor="middle">User Commands</text><text x="816" y="74" class="d" text-anchor="end">SUDARAKA(1)</text></g>
<text x="44" y="116" class="h" opacity="0"><set attributeName="opacity" to="1" begin="2.37s" fill="freeze"/>NAME</text>
<text x="44" y="137" class="a" opacity="0" xml:space="preserve"><set attributeName="opacity" to="1" begin="2.44s" fill="freeze"/>    sudaraka - architects and builds scalable, high-performance systems</text>
<text x="44" y="179" class="h" opacity="0"><set attributeName="opacity" to="1" begin="2.51s" fill="freeze"/>SYNOPSIS</text>
<text x="44" y="200" class="a" opacity="0" xml:space="preserve"><set attributeName="opacity" to="1" begin="2.58s" fill="freeze"/>    <tspan class="h">sudaraka</tspan> [<tspan class="h">--architect</tspan>] [<tspan class="h">--build</tspan>] [<tspan class="h">--lead</tspan>] [<tspan class="h">--learn-something-new</tspan>]</text>
<text x="44" y="242" class="h" opacity="0"><set attributeName="opacity" to="1" begin="2.65s" fill="freeze"/>DESCRIPTION</text>
<text x="44" y="263" class="a" opacity="0" xml:space="preserve"><set attributeName="opacity" to="1" begin="2.72s" fill="freeze"/>    Sudaraka Senevirathne, based in Sri Lanka.</text>
<text x="44" y="284" class="a" opacity="0" xml:space="preserve"><set attributeName="opacity" to="1" begin="2.79s" fill="freeze"/>    Designs full-stack systems end to end and leads agile teams that</text>
<text x="44" y="305" class="a" opacity="0" xml:space="preserve"><set attributeName="opacity" to="1" begin="2.86s" fill="freeze"/>    ship enterprise software.</text>
<text x="44" y="347" class="h" opacity="0"><set attributeName="opacity" to="1" begin="2.93s" fill="freeze"/>OPTIONS</text>
<text x="44" y="368" class="a" opacity="0" xml:space="preserve"><set attributeName="opacity" to="1" begin="3.00s" fill="freeze"/>    <tspan class="h">--backend </tspan>  java, spring boot, node.js, c++</text>
<text x="44" y="389" class="a" opacity="0" xml:space="preserve"><set attributeName="opacity" to="1" begin="3.07s" fill="freeze"/>    <tspan class="h">--frontend</tspan>  typescript, javascript, react, angular</text>
<text x="44" y="410" class="a" opacity="0" xml:space="preserve"><set attributeName="opacity" to="1" begin="3.14s" fill="freeze"/>    <tspan class="h">--data    </tspan>  postgresql, mongodb, dynamodb</text>
<text x="44" y="431" class="a" opacity="0" xml:space="preserve"><set attributeName="opacity" to="1" begin="3.21s" fill="freeze"/>    <tspan class="h">--infra   </tspan>  aws, gcp, docker, git, linux</text>
<text x="44" y="473" class="h" opacity="0"><set attributeName="opacity" to="1" begin="3.28s" fill="freeze"/>AVAILABILITY</text>
<g opacity="0"><set attributeName="opacity" to="1" begin="3.35s" fill="freeze"/><circle cx="84.2" cy="489" r="4" fill="#ffd98a"><animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/></circle><text x="96.2" y="494" class="a">Open to freelance work.</text></g>
<text x="44" y="536" class="h" opacity="0"><set attributeName="opacity" to="1" begin="3.42s" fill="freeze"/>BUGS</text>
<text x="44" y="557" class="a" opacity="0" xml:space="preserve"><set attributeName="opacity" to="1" begin="3.49s" fill="freeze"/>    Cannot see a monolith without drawing boxes around it.</text>
<text x="44" y="599" class="h" opacity="0"><set attributeName="opacity" to="1" begin="3.56s" fill="freeze"/>SEE ALSO</text>
<text x="44" y="620" class="a" opacity="0" xml:space="preserve"><set attributeName="opacity" to="1" begin="3.63s" fill="freeze"/>    sudarakase@gmail.com, github(1), linkedin(1)</text>
